name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
      - name: Test and build native application
        shell: pwsh
        run: ./scripts/build.ps1 -WithTools
      - name: Vet
        run: go vet ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DaisText-windows-x64
          path: |
            dist/DaisText.exe
            dist/daistext-cli.exe
            dist/README.md
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES.md
            dist/tools/
            dist/liblouis/
