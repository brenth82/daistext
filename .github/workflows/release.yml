name: Release Windows installer
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and test without signing credentials
    if: github.repository == 'brenth82/daistext' && github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build offline installer with pinned conversion tools
        shell: pwsh
        env:
          DAISTEXT_UPDATE_PUBLIC_KEY: ${{ vars.DAISTEXT_UPDATE_PUBLIC_KEY }}
        run: |
          if (-not $env:DAISTEXT_UPDATE_PUBLIC_KEY) { throw 'Configure the repository public key variable first' }
          ./scripts/package.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v','')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: dist/DaisText-Setup.exe
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Approve and sign on an isolated runner
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: dist
      # Optional organization-specific Authenticode signing belongs here, BEFORE hashing.
      - name: Sign update manifest
        shell: pwsh
        env:
          DAISTEXT_UPDATE_PRIVATE_KEY: ${{ secrets.DAISTEXT_UPDATE_PRIVATE_KEY }}
          DAISTEXT_UPDATE_PUBLIC_KEY: ${{ vars.DAISTEXT_UPDATE_PUBLIC_KEY }}
          GOTOOLCHAIN: local
        run: |
          $pinned = (Get-Content release/update-public-key.txt -Raw).Trim()
          if ($pinned -ne $env:DAISTEXT_UPDATE_PUBLIC_KEY) { throw 'Protected trust key differs from the reviewed source' }
          go run ./cmd/release-sign -version ($env:GITHUB_REF_NAME -replace '^v','')
          if ($LASTEXITCODE) { throw 'Release signing failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authenticated-release
          path: |
            dist/DaisText-Setup.exe
            dist/update.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and publish without signing credentials
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authenticated-release
          path: dist
      - name: Independently verify signature and installer hash
        shell: pwsh
        run: |
          go run ./cmd/release-sign -verify -version ($env:GITHUB_REF_NAME -replace '^v','')
          if ($LASTEXITCODE) { throw 'Release verification failed' }
      - name: Publish installer and authenticated manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/DaisText-Setup.exe dist/update.json --verify-tag --generate-notes
          if ($LASTEXITCODE) { throw 'Release publication failed' }
